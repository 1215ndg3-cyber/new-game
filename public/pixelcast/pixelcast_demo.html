<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCast 像素群像</title>
<style>
  :root{--bg:#1c1e23;--panel:#272a31;--line:#3a3e47;--tx:#e6e8ec;--dim:#8d929e;--acc:#d9dce3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 16px 24px}
  h1{font-size:15px;font-weight:600;margin:4px 0 0;letter-spacing:.04em}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:960px}
  button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--dim)} button.on{background:#3b4150;border-color:#8d929e}
  #stage{position:relative;line-height:0;border:2px solid var(--line);border-radius:4px;overflow:hidden;max-width:100%}
  #cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bub{position:absolute;transform:translate(-50%,-100%);background:#2a2d34;color:#eceef2;border:2px solid #9a9fab;border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#9a9fab;border-bottom:0}
  .tag{position:absolute;transform:translate(-50%,-100%);font-size:11px;color:#f1f2f5;text-shadow:0 1px 2px #000;opacity:.8;white-space:nowrap}
  #hint{color:var(--dim);font-size:12px;text-align:center;max-width:960px}
  kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace}
  #cards{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:10px;max-width:1080px;width:100%}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .card.sel{border-color:#d9dce3}
  .card canvas{width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#9a9ea9;border-radius:4px;aspect-ratio:32/30}
  .card h3{margin:0;font-size:14px} .card h3 small{color:var(--dim);font-weight:400;margin-left:4px}
  .card .d{font-size:12px;color:var(--dim)} .card .i{font-size:12px;color:var(--acc)}
  .tr{display:grid;grid-template-columns:34px 1fr;gap:2px 6px;font-size:11px;color:var(--dim);align-items:center;margin-top:2px}
  .tr i{display:block;height:4px;background:#3a3e47;border-radius:2px;position:relative} .tr i b{position:absolute;left:0;top:0;bottom:0;background:#aab0bd;border-radius:2px}
  @media (max-width:760px){#cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>PixelCast · 同一副骨架，六位角色与太空服/瞬移</h1>
<div class="bar">
  <button id="bPause">暂停</button>
  <button id="bFast">快进 ×3</button>
  <button id="bLine">集合对比待机</button>
  <button id="bSuit">太空服：关</button>
  <button id="bBlink">瞬移 (J)</button>
  <button id="bTake">接管所选角色</button>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="ov"></div></div>
<div id="hint"><kbd>A</kbd><kbd>D</kbd> 走 · <kbd>Shift</kbd> 跑 · <kbd>空格</kbd> 跳（空中再按二段翻滚）· <kbd>S</kbd> 蹲 · <kbd>Y</kbd> 向最近的人搭话 · <kbd>J</kbd> 瞬移（星）· <kbd>U</kbd> 太空服 · <kbd>1</kbd>–<kbd>6</kbd> 或点击角色切换 · <kbd>T</kbd> 接管/放开</div>
<div id="cards"></div>

<script>/* PixelRig：像素人物通用骨架与渲染（无 DOM，浏览器和 Node 都能用）
 * 角度约定：以“垂直向下”为 0，朝向前方为正，单位度。人物默认朝右，镜像得到朝左。
 * 一个人物 = 骨架(SKELETON) + 角色规格(spec: build/look/gait/idle) + 姿势(pose)。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PixelRig = factory();
})(typeof globalThis !== 'undefined' ? globalThis : (typeof self !== 'undefined' ? self : this), function () {
  'use strict';
  const GW = 32, GH = 80, GOFF = 30, FOOT = 45, SHY = 35;
  const rad = d => d * Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const SKELETON = {
    note: '像素人物通用骨架。角度以垂直向下为0，朝前为正，单位度；默认朝右，镜像得到朝左。',
    grid: { width: GW, height: GH, rowOffset: GOFF, footRow: FOOT, standingHipRow: SHY, spriteCell: [32, 48] },
    defaultBuild: { thigh: 6, shin: 5, upper: 3, fore: 3 },
    bones: [
      { name: 'pelvis', parent: null, note: '根骨骼，髋关节在 列15.5、行hy，骨盆2行' },
      { name: 'torso', parent: 'pelvis', length: 4, widthPx: 2, note: '躯干4行，宽2（45°视角肩宽4）；lean 让上身逐行前倾，bob 让上身整体上下 ±1 行' },
      { name: 'neck', parent: 'torso', length: 1 },
      { name: 'head', parent: 'neck', size: [5, 5], note: '头 5列x5行（侧面）/6列x5行（45°）。上两行全是头发，脸从第3行开始；head:[dx,dy] 可整体偏移（低头、探头）' },
      { name: 'upperArmNear', parent: 'torso', length: 3, note: '肩在 列16+lean、行hy-7+bob，角度 na[0]' },
      { name: 'foreArmNear', parent: 'upperArmNear', length: 3, note: '角度 na[1]，末端是手' },
      { name: 'upperArmFar', parent: 'torso', length: 3, note: '肩在 列15+lean，画在身体后面，角度 fa[0]' },
      { name: 'foreArmFar', parent: 'upperArmFar', length: 3, note: '角度 fa[1]' },
      { name: 'thighNear', parent: 'pelvis', length: 6, note: '宽2像素，角度 nl[0]' },
      { name: 'shinNear', parent: 'thighNear', length: 5, note: '角度 nl[1]（绝对角，不是相对角）' },
      { name: 'footNear', parent: 'shinNear', length: 3, note: '脚3像素，朝前' },
      { name: 'thighFar', parent: 'pelvis', length: 6, note: '角度 fl[0]' },
      { name: 'shinFar', parent: 'thighFar', length: 5, note: '角度 fl[1]' },
      { name: 'footFar', parent: 'shinFar', length: 3 },
      { name: 'hairChain', parent: 'head', note: '马尾/长发/外套下摆：两节链，角度 tail[0]、tail[1]，表示向后下方的飘动' }
    ],
    view34: '待机用 45° 视角：po.v34=true；此时 na/fa 为画面左/右臂、nl/fl 为画面左/右腿，角度在画面平面内（向下为0，向画面右为正）',
    pose: {
      nl: '近侧腿 [大腿角, 小腿绝对角]', fl: '远侧腿', na: '近侧手臂 [上臂角, 前臂角]', fa: '远侧手臂',
      tail: '头发/外套飘动 [第一节角, 第二节角]', lean: '躯干前倾像素 0..2（-1 为后仰）', bob: '上身下沉像素（呼吸、叹气、缩肩）',
      head: '[dx,dy] 头部偏移', blink: '是否闭眼'
    }
  };

  const mkG = () => Array.from({ length: GH }, () => Array(GW).fill(null));
  function put(g, x, y, c) { x = Math.round(x); y = Math.round(y); if (c && x >= 0 && y >= 0 && x < GW && y < GH) g[y][x] = c; }
  function line(g, x0, y0, x1, y1, c, w) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), stx = x0 < x1 ? 1 : -1, sty = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    while (true) {
      for (let i = 0; i < w; i++) put(g, x0 + i, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += stx; }
      if (e2 <= dx) { e += dx; y0 += sty; }
    }
  }
  function legPts(b, th, sh) {
    const kx = b.thigh * Math.sin(rad(th)), ky = b.thigh * Math.cos(rad(th));
    return { kx, ky, ax: kx + b.shin * Math.sin(rad(sh)), ay: ky + b.shin * Math.cos(rad(sh)) };
  }
  function armPts(b, u, f) {
    const ex = b.upper * Math.sin(rad(u)), ey = b.upper * Math.cos(rad(u));
    return { ex, ey, wx: ex + b.fore * Math.sin(rad(f)), wy: ey + b.fore * Math.cos(rad(f)) };
  }
  function gHy(b, po) {
    const a = legPts(b, po.nl[0], po.nl[1]), c = legPts(b, po.fl[0], po.fl[1]);
    return FOOT - Math.max(Math.round(a.ay), Math.round(c.ay));
  }
  function drawLeg2(g, L, hx, hy, cols) {
    line(g, hx, hy, hx + L.kx, hy + L.ky, cols[0], 2);
    line(g, hx + L.kx, hy + L.ky, hx + L.ax, hy + L.ay, cols[1], 2);
    const ax = Math.round(hx + L.ax), ay = Math.round(hy + L.ay);
    if (cols[3]) { put(g, ax, ay - 1, cols[3]); put(g, ax + 1, ay - 1, cols[3]); }
    for (let i = 0; i < 3; i++) put(g, ax + i, ay, cols[2]);
  }
  function drawArm2(g, A, sx, sy, cols, thick) {
    if (thick) {                                      // 袖子：靠肩膀的前 2/3 上臂加粗到 2 像素
      const px = sx + A.ex * 0.67, py = sy + A.ey * 0.67, off = thick < 0 ? -1 : 0;
      line(g, sx + off, sy, px + off, py, cols[0], 2);
    }
    line(g, sx, sy, sx + A.ex, sy + A.ey, cols[0], 1);
    line(g, sx + A.ex, sy + A.ey, sx + A.wx, sy + A.wy, cols[1], 1);
    put(g, sx + A.wx, sy + A.wy, cols[2]);
  }

  /* 头部像素图：[dx,dy,色键]  h发 H发高光 s皮肤 e眼 a耳/皮肤暗部 x帽 X帽高光 b帽檐
   * 侧面：5列x5行（dy=-1 是发髻/帽顶）。前两行全是头发，脸从第3行(dy=2)开始，眼睛旁边紧挨着一列皮肤 → 脸 2 列宽 */
  const FACE = [[0,2,'h'],[1,2,'h'],[2,2,'h'],[3,2,'h'],[4,2,'s'],
    [0,3,'h'],[1,3,'a'],[2,3,'h'],[3,3,'s'],[4,3,'s'],
    [0,4,'h'],[1,4,'h'],[2,4,'h'],[3,4,'s'],[4,4,'s']];
  const TOP = [[0,0,'h'],[1,0,'h'],[2,0,'H'],[3,0,'h'],[4,0,'h'],[0,1,'h'],[1,1,'h'],[2,1,'h'],[3,1,'H'],[4,1,'h']];
  const HEADS = {
    ponytail: [[1,-1,'h'],[2,-1,'h']].concat(TOP, FACE),
    short: [[1,-1,'h'],[2,-1,'H'],[3,-1,'h']].concat(TOP, FACE),
    long: TOP.concat(FACE),
    cap: [[1,-1,'x'],[2,-1,'X'],[3,-1,'x'],[0,0,'x'],[1,0,'x'],[2,0,'X'],[3,0,'x'],[4,0,'x'],[0,1,'x'],[1,1,'x'],[2,1,'x'],[3,1,'x'],[4,1,'x'],[5,1,'b'],
      [0,2,'h'],[1,2,'h'],[2,2,'h'],[3,2,'h'],[4,2,'a'],[0,3,'h'],[1,3,'a'],[2,3,'h'],[3,3,'s'],[4,3,'s'],[0,4,'h'],[1,4,'h'],[2,4,'h'],[3,4,'s'],[4,4,'s']],
    bob: TOP.concat(FACE.slice(0, 14), [[0,5,'h'],[1,5,'h'],[2,5,'h']])
  };
  /* 45° 视角头：6列x5行，脸 2 列宽居中偏右，左侧露出耳/脸颊，头发在两侧包住 */
  const FACE34 = [[0,2,'h'],[1,2,'h'],[2,2,'h'],[3,2,'s'],[4,2,'s'],
    [0,3,'h'],[1,3,'a'],[2,3,'h'],[3,3,'s'],[4,3,'s'],
    [0,4,'h'],[1,4,'a'],[2,4,'h'],[3,4,'s'],[4,4,'s']];
  const TOP34 = [[0,0,'h'],[1,0,'h'],[2,0,'H'],[3,0,'h'],[4,0,'h'],[5,0,'h'],[0,1,'h'],[1,1,'h'],[2,1,'h'],[3,1,'H'],[4,1,'h'],[5,1,'h']];
  const HEADS34 = {
    ponytail: [[1,-1,'h'],[2,-1,'h']].concat(TOP34, FACE34),
    short: [[1,-1,'h'],[2,-1,'H'],[3,-1,'h']].concat(TOP34, FACE34),
    long: TOP34.concat(FACE34, []),
    cap: [[1,-1,'x'],[2,-1,'X'],[3,-1,'x'],[4,-1,'x'],[0,0,'x'],[1,0,'x'],[2,0,'X'],[3,0,'x'],[4,0,'x'],[5,0,'x'],[0,1,'x'],[1,1,'x'],[2,1,'x'],[3,1,'x'],[4,1,'x'],[5,1,'x'],[6,1,'b'],[7,1,'b'],
      [0,2,'h'],[1,2,'h'],[2,2,'h'],[3,2,'a'],[4,2,'a'],[0,3,'h'],[1,3,'a'],[2,3,'h'],[3,3,'s'],[4,3,'s'],[0,4,'h'],[1,4,'a'],[2,4,'h'],[3,4,'s'],[4,4,'s']],
    bob: TOP34.concat(FACE34, [[0,5,'h'],[1,5,'h']])
  };
  function headKey(look, po) {
    const c = look.cols;
    return { h: c.hair, H: c.hairHi || c.hair, s: c.skin, e: po.blink ? c.skin : c.eye, a: c.skinSh || c.skin, x: c.hat, X: c.hatHi || c.hat, b: c.hatBrim || c.hat };
  }
  function drawHead(g, look, po, ox, oy) {
    const map = HEADS[look.hair] || HEADS.ponytail, key = headKey(look, po);
    for (const m of map) put(g, ox + m[0], oy + m[1], key[m[2]]);
  }
  function drawHead34(g, look, po, ox, oy) {
    const map = HEADS34[look.hair] || HEADS34.ponytail, key = headKey(look, po);
    for (const m of map) put(g, ox + m[0], oy + m[1], key[m[2]]);
  }
  function drawFlask(g, hx, hy, dx, dy, c) {
    const cx = Math.round(hx + dx * 1.6), cy = Math.round(hy + dy * 1.6 - 0.5);
    put(g, cx, cy - 2, '#7a5a3a'); put(g, cx, cy - 1, c.glass || '#d6e6ee');
    put(g, cx - 1, cy, c.glass || '#d6e6ee'); put(g, cx, cy, c.liquid || '#b5523a'); put(g, cx + 1, cy, c.liquid || '#b5523a');
    put(g, cx - 1, cy + 1, c.liquid || '#b5523a'); put(g, cx, cy + 1, c.liquid2 || '#8e3a28'); put(g, cx + 1, cy + 1, c.liquid2 || '#8e3a28');
  }


  /* ---------- 太空服图层：对任意角色都能穿，所有姿势通用 ---------- */
  const SU = { SW: '#e3e9f1', SS: '#aab8c9', SD: '#6f7f96', AC: '#ef7b3a', BT: '#39455a', GL: '#7fb4e6', HL: '#d6efff', PK: '#9aa6b8', NZ: '#2d3342' };
  const HELM7 = ['..XXX..', '.X...X.', 'X.....X', 'X.....X', 'X.....X', 'X.....X', '.X...X.', '..XXX..'];
  const HELM8 = ['..XXXX..', '.X....X.', 'X......X', 'X......X', 'X......X', 'X......X', '.X....X.', '..XXXX..'];
  const suitCache = new WeakMap();
  function suitSpec(spec) {              // 把角色的衣服/袖子/裤子换成太空服配色，头发收进头盔
    let r = suitCache.get(spec); if (r) return r;
    const lc = spec.look.cols, h = spec.look.hair;
    r = Object.assign({}, spec, { look: Object.assign({}, spec.look, { outfit: 'tee', prop: 'none', hair: (h === 'cap' || h === 'long') ? 'short' : h,
      cols: Object.assign({}, lc, { top: SU.SW, topSh: SU.SS, belt: SU.SD, pelvis: SU.SS, armN: [SU.SW, SU.SW, SU.SD], armF: [SU.SS, SU.SS, SU.SD],
        legN: [SU.SW, SU.SW, SU.BT, SU.SD], legF: [SU.SS, SU.SS, SU.BT, SU.SD] }) }) });
    suitCache.set(spec, r); return r;
  }
  function drawHelmet(g, x0, y0, rows) {
    const w = rows[0].length;
    rows.forEach((row, r) => { for (let c = 0; c < w; c++) {
      if (row[c] !== 'X') continue;
      let col = r <= 1 ? SU.SW : r >= 5 ? SU.SS : (c === 0 ? SU.SS : SU.SW);
      if (r === 7) col = SU.AC; if (c === w - 1 && r >= 2 && r <= 5) col = SU.GL;
      put(g, x0 + c, y0 + r, col);
    } });
    put(g, x0 + 4, y0 + 1, SU.HL); put(g, x0 + w - 1, y0 + 2, SU.HL);
  }
  function drawFlame(g, cols, hy, flame) {
    const len = Math.round(2 + 4 * flame), fc = ['#fff2b8', '#ffc24d', '#ff8a33', '#d4502a', '#8a3322'];
    for (let r = 0; r < len; r++) for (const x of cols) { if (r >= 2 && Math.random() < 0.3 * r / len) continue; put(g, x, hy - 1 + r, fc[Math.min(4, Math.floor(r * 5 / len))]); }
  }
  function drawPack(g, hy, ub, L, flame) {             // 侧面背包：躯干后面两列
    const sh = y => Math.round(L * (hy - 3 - y) / 4);
    if (flame > 0) drawFlame(g, [13, 14], hy, flame);
    for (let y = hy - 6 + ub; y <= hy - 3; y++) { const s = sh(y); put(g, 13 + s, y, SU.PK); put(g, 14 + s, y, SU.SS); }
    put(g, 13 + sh(hy - 5 + ub), hy - 5 + ub, SU.AC); put(g, 13, hy - 2, SU.NZ); put(g, 14, hy - 2, SU.NZ);
  }

  /* 画一个完整人物到网格 g（hy 为髋所在行，已含 GOFF）。opts: {suit, flame} */
  function drawCharacter(g, spec, po, hy, opts) {
    const suit = !!(opts && opts.suit); if (suit) spec = suitSpec(spec);
    const b = spec.build, look = spec.look, c = look.cols, o = look.outfit;
    if (po.v34) return drawChar34(g, spec, po, hy, suit, opts);
    const L = po.lean || 0, ub = po.bob || 0, hd = po.head || [0, 0], hx = 15, sy = hy - 6 + ub;
    const LN = legPts(b, po.nl[0], po.nl[1]), LF = legPts(b, po.fl[0], po.fl[1]);
    const shf = y => Math.round(L * (hy - 3 - y) / 4);
    const ox = 13 + L + hd[0], oy = hy - 12 + ub + hd[1];
    drawArm2(g, armPts(b, po.fa[0], po.fa[1]), 15 + L, sy, c.armF, o === 'labcoat' ? -1 : 0);
    drawLeg2(g, LF, hx, hy, c.legF);
    if (suit) drawPack(g, hy, ub, L, opts.flame || 0);
    if (o === 'labcoat') {                           // 白大褂敞开：只有身后的下摆随风飘，前面露出里面的深色衣服
      const fly = Math.round(clamp(((po.tail ? po.tail[0] : 30) - 10) / 25, 0, 2));
      for (let y = hy - 2; y <= hy + 4; y++) {
        const back = y >= hy + 1 ? fly : 0;
        for (let x = 13 - back + L; x <= 14 + L; x++) put(g, x, y, y === hy + 4 || x < 14 + L ? c.coatSh : c.coat);
      }
    }
    if (look.hair === 'long') {
      const t0 = po.tail ? po.tail[0] : 30;
      for (let r = 0; r < 8; r++) {
        const dx = Math.round(-Math.sin(rad(clamp(t0, -20, 70))) * r * 0.45), x0 = ox - 1 + dx;
        put(g, x0, oy + 2 + r, c.hair); put(g, x0 + 1, oy + 2 + r, r % 3 === 1 ? c.hairHi : c.hair);
      }
    }
    for (let y = hy - 6 + ub; y <= hy - 3; y++) {
      const s = shf(y);
      let bk = c.topSh || c.top, fr = c.top;
      if (o === 'labcoat') { bk = c.coat; fr = c.top; }
      else if (o === 'overalls') { bk = c.top; fr = c.bib; }
      if (y === hy - 6 + ub) {
        if (o === 'labcoat') { bk = c.coat; fr = c.coat; } else if (o === 'vest') fr = c.collar; else if (o === 'hoodie') { fr = c.hood; bk = c.hood; } else if (o === 'overalls') bk = c.bib;
      }
      if (y === hy - 3 && c.belt) { bk = c.belt; fr = c.belt; }
      put(g, 15 + s, y, bk); put(g, 16 + s, y, fr);
    }
    for (let y = hy - 2; y <= hy - 1; y++) { put(g, 15, y, c.pelvis); put(g, 16, y, c.pelvis); }
    if (hd[1] <= 0) put(g, 16 + L, hy - 7 + ub, c.skinSh || c.skin);
    if (o === 'hoodie') { put(g, ox, oy + 5, c.hood); put(g, ox + 1, oy + 5, c.hood); put(g, ox, oy + 6, c.hood); }

    for (let y = top; y < base + 40 && y < VH; y++) {
      let c = col;
      if (win && ((wx % 7) === 3) && ((y - top) % 9 === 4) && y - top > 5 && y - top < h - 6) c = mix(col, PAL.fog, 0.45);   // 窗洞
      const f = fogAmt * (1 - (y - top) / (h + 20)) * 0.55;
      if (f > 0 && bay(sx, y) < f) c = mix(c, PAL.fog, 0.5);
      px(sx, y, c);
    }
  }
}
function drawBackground(camX, t) {
  const bands = [PAL.sky0, PAL.sky1, PAL.sky2];
  for (let y = 0; y < VH; y++) {
    const k = (y / VH) * 2, i = Math.min(1, Math.floor(k)), f = k - i;
    for (let x = 0; x < VW; x++) buf[y * VW + x] = bay(x, y) < f ? bands[i + 1] : bands[i];
  }
  drawLayer(FAR, 0.12, camX, 126, PAL.far, false, t, 1.0);
  // 雾带
  for (let y = 70; y < 138; y++) for (let x = 0; x < VW; x++) { const p = 0.5 * Math.exp(-Math.pow((y - 118) / 20, 2)); if (bay(x, y) < p) buf[y * VW + x] = mix(buf[y * VW + x], PAL.fog, 0.55); }
  drawLayer(MID, 0.3, camX, 140, PAL.mid, true, t, 0.7);
  // 近景残柱
  const px0 = camX * 0.65;
  for (const p of PIL) {
    const sx = Math.floor(p.x - px0); if (sx < -40 || sx > VW + 10) continue;
    for (let i = 0; i < p.w; i++) {
      const top = 150 - p.h + (i < p.cut / 2 ? p.cut - i : 0);
      for (let y = top; y < 152; y++) { let c = i < 3 ? PAL.nearHi : PAL.near; if ((y + i) % 17 === 0) c = mix(c, PAL.ink, 0.3); if (bay(sx + i, y) < 0.18 + (y - top) / p.h * -0.0 + (y < 110 ? 0.3 : 0)) c = mix(c, PAL.fog, 0.35); px(sx + i, y, c); }
    }
  }
}
function drawGround(camX, H) {
  const cx = Math.floor(camX);
  for (let sx = 0; sx < VW; sx++) {
    const wx = Math.max(0, Math.min(WW - 1, cx + sx)), top = H[wx];
    for (let y = top; y < VH; y++) {
      const d = y - top; let c = PAL.gBase;
      if (d === 0) c = PAL.gTop; else if (d < 3) c = PAL.gHi;
      else if (d % 14 === 0 || ((wx + Math.floor(d / 14) * 9) % 26) === 0) c = PAL.gDark;
      else if (bay(wx, y) < 0.12) c = PAL.gDark;
      if (d > 14) c = mix(c, PAL.gDark, Math.min(0.5, (d - 14) / 40));
      px(sx, y, c);
    }
  }
}
function drawPOI(p, camX, t) {
  const sx = Math.floor(p.x - camX), y = AI_H[Math.max(0, Math.min(WW - 1, p.x))];
  if (sx < -30 || sx > VW + 30) return;
  if (p.type === 'lamp') {
    rect(sx, y - 40, 2, 40, PAL.ink); rect(sx - 3, y - 2, 8, 2, PAL.ink); rect(sx - 4, y - 44, 10, 5, PAL.ink);
    rect(sx - 3, y - 43, 8, 3, mix(PAL.glow, C('#ffffff'), 0.4 + 0.1 * Math.sin(t * 3 + p.x)));
    for (let j = -14; j <= 14; j++) for (let i = -16; i <= 16; i++) { const d = Math.hypot(i, j * 1.2) / 16; if (d < 1 && bay(sx + i, y - 41 + j) < (1 - d) * 0.5) { const q = (sx + i) | 0, r = (y - 41 + j) | 0; if (q >= 0 && q < VW && r >= 0 && r < VH) buf[r * VW + q] = mix(buf[r * VW + q], PAL.glow, 0.5); } }
  } else if (p.type === 'crate') {
    rect(sx - 7, y - 13, 14, 13, C('#5e5a55')); rect(sx - 7, y - 13, 14, 2, C('#7d7870')); rect(sx - 7, y - 1, 14, 1, C('#403d3a'));
    for (let i = 0; i < 12; i++) { px(sx - 6 + i, y - 12 + i, C('#403d3a')); px(sx + 5 - i, y - 12 + i, C('#403d3a')); }
  } else if (p.type === 'bench') {
    rect(sx - 11, y - 8, 22, 2, C('#4b4e57')); rect(sx - 11, y - 14, 22, 2, C('#4b4e57')); rect(sx - 10, y - 8, 2, 8, C('#33363d')); rect(sx + 8, y - 8, 2, 8, C('#33363d')); rect(sx - 10, y - 14, 2, 6, C('#33363d')); rect(sx + 8, y - 14, 2, 6, C('#33363d'));
  } else if (p.type === 'ruin') {
    for (let i = 0; i < 12; i++) { const top = y - 46 + (i > 7 ? (i - 7) * 4 : 0); for (let j = top; j < y; j++) px(sx - 6 + i, j, i < 3 ? PAL.nearHi : ((j + i) % 13 === 0 ? PAL.gDark : PAL.near)); }
  }
}

/* ---------- 世界 / 角色 ---------- */
const world = AI.createWorld(11), AI_H = world.H;
let selected = 0, camX = 0, paused = false, speed = 1, lineup = false;
function pxA(x, y, c, a) {
  x |= 0; y |= 0;
  if (x >= 0 && y >= 0 && x < VW && y < VH) buf[y * VW + x] = a >= 0.99 ? c : mix(buf[y * VW + x], c, a);
}
const puffs = [], streaks = [], rings = [], sparks = [], bghosts = [], trails = {};
const PF = [[[-1,0],[1,0]],[[-2,0],[2,0],[-1,-1],[1,-1]],[[-3,-1],[3,-1],[-2,-2],[2,-2]],[[-3,-2],[3,-2]]];
function stepFX(dt) {
  while (world.fx.length) {
    const e = world.fx.shift();
    if (e.type === 'puff') puffs.push({ x: e.x, y: e.y, age: 0 });
    else if (e.type === 'blink') {
      const ag = world.agents.find(x => x.id === e.id);
      const spec = ag ? ag.spec : Cast.CAST[5], suit = ag ? ag.suit : false;
      const P = Rig.poser(spec), po = P.blinkWind(), hy = P.hyGround(po);
      streaks.push({ x0: e.x0, x1: e.x1, y: e.y - 12, age: 0 });
      rings.push({ x: e.x1, y: e.y - 12, age: 0 });
      rings.push({ x: e.x0, y: e.y - 12, age: 0.08 });
      [0, 0.35, 0.7].forEach(f => bghosts.push({ x: e.x0 + (e.x1 - e.x0) * f, y: e.y, spec, po, hy, suit, flip: e.face < 0, age: 0 }));
      for (let i = 0; i < 12; i++) sparks.push({ x: e.x0 + (e.x1 - e.x0) * Math.random(), y: e.y - 12 + (Math.random() * 10 - 5), vy: -10 - Math.random() * 18, age: 0 });
    }
  }
  const keep = (arr, max) => { for (let i = arr.length - 1; i >= 0; i--) { arr[i].age += dt; if (arr[i].age >= max) arr.splice(i, 1); } };
  keep(puffs, 0.28); keep(streaks, 0.26); keep(rings, 0.26); keep(bghosts, 0.28);
  for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].age += dt; sparks[i].y += sparks[i].vy * dt; if (sparks[i].age >= 0.34) sparks.splice(i, 1); }
  world.agents.forEach(a => {
    const tr = trails[a.id] || (trails[a.id] = { t: 0, list: [] });
    tr.t += dt;
    if (a.loc === 'sprint' && tr.t >= 0.035) {
      tr.t = 0;
      const fp = AI.framePose(a);
      tr.list.unshift({ x: a.x, y: a.y, up: fp.up, spec: a.spec, po: fp.po, hy: fp.hy, phi: fp.phi, suit: fp.suit, flip: a.face < 0, age: 0 });
      if (tr.list.length > 3) tr.list.pop();
    }
    for (let i = tr.list.length - 1; i >= 0; i--) { tr.list[i].age += dt; if (tr.list[i].age > 0.16 || a.loc !== 'sprint') tr.list.splice(i, 1); }
  });
}
function drawGrid(g, x0, y0, flip, alpha, tint, smearDir, smearLen) {
  const cyan = C('#96ebff');
  for (let r = 0; r < Rig.GH; r++) for (let c = 0; c < Rig.GW; c++) {
    const col = g[r][c]; if (!col) continue;
    const sx = x0 + (flip ? Rig.GW - 1 - c : c), sy = y0 + r;
    if (smearLen) for (let k = 1; k <= smearLen; k++) pxA(sx - smearDir * k, sy, cyan, 0.45 * (1 - k / (smearLen + 1)));
    pxA(sx, sy, tint || C(col), alpha);
  }
}
function drawFXBack(camX) {
  const cx = Math.floor(camX), cyan = C('#96ebff'), white = C('#ebfcff');
  bghosts.forEach(b => {
    const g = Rig.charGrid(b.spec, b.po, b.hy, 0, { suit: b.suit });
    drawGrid(g, Math.round(b.x) - 16 - cx, Math.round(b.y) - 76, b.flip, 0.55 * (1 - b.age / 0.28), cyan, 0, 0);
  });
  streaks.forEach(s => {
    const ht = s.age < 0.06 ? 2 : s.age < 0.14 ? 1 : 0, a = 1 - s.age / 0.26;
    const xa = Math.round(Math.min(s.x0, s.x1)) - cx, xb = Math.round(Math.max(s.x0, s.x1)) - cx, sy = Math.round(s.y);
    for (let x = xa; x <= xb; x++) for (let r = -ht; r <= ht; r++) {
      if (s.age > 0.1 && ((x + r) & 1)) continue;
      pxA(x, sy + r, r === 0 ? white : cyan, a);
    }
  });
}
function drawFXFront(camX) {
  const cx = Math.floor(camX), dust = C('#cfd3dc'), cyan = C('#bef5ff'), white = C('#ffffff');
  puffs.forEach(p => {
    const fr = PF[Math.min(3, Math.floor(p.age / 0.07))], sx = Math.round(p.x) - cx, sy = Math.round(p.y);
    fr.forEach(d => pxA(sx + d[0], sy + d[1], dust, 0.85));
  });
  rings.forEach(r => {
    const rr = 2 + r.age * 30, a = 1 - r.age / 0.26, sx = Math.round(r.x) - cx, sy = Math.round(r.y);
    for (let k = 0; k < 20; k++) { const an = k / 20 * Math.PI * 2; pxA(Math.round(sx + rr * Math.cos(an)), Math.round(sy + rr * Math.sin(an) * 0.85), cyan, a); }
  });
  sparks.forEach(s => pxA(Math.round(s.x) - cx, Math.round(s.y), Math.random() < 0.5 ? white : cyan, 1 - s.age / 0.34));
}
function drawChar(a, camX, t) {
  const fp = AI.framePose(a), g = Rig.charGrid(a.spec, fp.po, fp.hy, fp.phi, { suit: fp.suit, flame: fp.flame });
  const cx = Math.floor(camX), x0 = Math.round(a.x) - 16 - cx, y0 = Math.round(a.y) - 76 - fp.up;
  // 冲刺残影
  const tr = trails[a.id];
  if (tr && tr.list.length) {
    const al = [0.38, 0.22, 0.11];
    for (let k = tr.list.length - 1; k >= 0; k--) {
      const s = tr.list[k], sg = Rig.charGrid(s.spec, s.po, s.hy, s.phi, { suit: s.suit });
      drawGrid(sg, Math.round(s.x) - 16 - cx, Math.round(s.y) - 76 - s.up, s.flip, al[k] || 0.1, 0, 0, 0);
    }
  }
  // 影子
  const sy = Math.round(a.y);
  for (let i = -6; i <= 6; i++) { const q = Math.round(a.x) + i - cx; if (q >= 0 && q < VW && sy < VH) { const gy = AI_H[Math.max(0, Math.min(WW - 1, Math.round(a.x) + i))]; if (Math.abs(gy - sy) < 6 && bay(q, gy) < 0.65 - Math.abs(i) / 14) px(q, gy, PAL.gDark); } }
  const flip = a.face < 0;
  const smear = a.loc === 'blinkPost' && a.blT < 0.14 ? Math.round(8 * (1 - a.blT / 0.14)) : 0;
  drawGrid(g, x0, y0, flip, 1, fp.flash ? C('#e8fbff') : 0, a.blDir || a.face, smear);
  return { sx: Math.round(a.x) - cx, top: y0 + 52 };
}
function drawFog(camX, t) {
  for (let y = 90; y < VH; y++) for (let x = 0; x < VW; x++) {
    const p = 0.16 * (0.5 + 0.5 * Math.sin((x + camX * 1.3) * 0.035 + t * 0.35 + y * 0.12)) * ((y - 90) / 90 > 0.6 ? 0.7 : 1);
    if (bay(x, y) < p) buf[y * VW + x] = mix(buf[y * VW + x], PAL.fog, 0.4);
  }
  const cxm = VW / 2, cym = VH / 2;                                       // 暗角
  for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) { const d = Math.hypot((x - cxm) / cxm, (y - cym) / cym); if (d > 0.9 && bay(x, y) < (d - 0.9) * 0.9) buf[y * VW + x] = mix(buf[y * VW + x], PAL.ink, 0.45); }
}
function drawMarker(sx, top, t) {
  const y = top - 8 + Math.round(Math.sin(t * 5));
  for (let i = 0; i < 4; i++) rect(sx - 3 + i, y + i, 7 - i * 2, 1, C('#f4f5f7'));
}

/* ---------- 气泡 ---------- */
const bubEls = world.agents.map(() => { const d = document.createElement('div'); d.className = 'bub'; d.style.display = 'none'; ov.appendChild(d); return d; });
const tagEls = world.agents.map((a) => { const d = document.createElement('div'); d.className = 'tag'; d.textContent = a.spec.name + ' · ' + a.spec.tag; ov.appendChild(d); return d; });
function placeOverlay(tops) {
  world.agents.forEach((a, i) => {
    const t = tops[i], b = bubEls[i], tg = tagEls[i];
    const X = t.sx * SC, Y = t.top * SC;
    tg.style.left = X + 'px'; tg.style.top = (Y - 9) + 'px'; tg.style.display = (a.say || t.sx < -20 || t.sx > VW + 20) ? 'none' : '';
    if (a.say && t.sx > -20 && t.sx < VW + 20) {
      if (b.textContent !== a.say.text) b.textContent = a.say.text;
      b.style.display = ''; b.style.left = Math.max(40, Math.min(VW * SC - 40, X)) + 'px'; b.style.top = (Y - 4) + 'px';
    } else b.style.display = 'none';
  });
}

/* ---------- 角色卡片（待机骨架动画） ---------- */
const cards = document.getElementById('cards'), cardCtx = [];
const BARS = [['soc', '社交'], ['en', '精力'], ['cau', '谨慎'], ['cur', '好奇'], ['pat', '耐心']];
world.agents.forEach((a, i) => {
  const s = a.spec, el = document.createElement('div'); el.className = 'card';
  el.innerHTML = '<canvas width="32" height="30"></canvas><h3>' + s.name + '<small>' + s.tag + '</small></h3><div class="d">' + s.desc + '</div><div class="i">待机：' + s.idleName + '</div><div class="tr">' +
    BARS.map(([k, n]) => '<span>' + n + '</span><i><b style="width:' + Math.round(s.traits[k] * 100) + '%"></b></i>').join('') + '</div>';
  el.onclick = () => select(i); cards.appendChild(el); cardCtx.push({ el, c: el.querySelector('canvas').getContext('2d') });
});
function drawCards(t) {
  cardCtx.forEach((cc, i) => {
    const a = world.agents[i], P = a.poser, po = P.idle(t, false), g = Rig.charGrid(a.spec, po, P.hyGround(po), 0, { suit: a.suit });
    cc.c.fillStyle = '#9a9ea9'; cc.c.fillRect(0, 0, 32, 30);
    cc.c.fillStyle = '#6a6e7a'; cc.c.fillRect(0, 28, 32, 2);
    for (let r = 0; r < 30; r++) for (let c = 0; c < 32; c++) { const col = g[r + 48][c]; if (col) { cc.c.fillStyle = col; cc.c.fillRect(c, r, 1, 1); } }
    cc.el.classList.toggle('sel', i === selected);
  });
}
function syncSuitBtn() {
  const a = world.agents[selected], b = document.getElementById('bSuit');
  if (b) { b.classList.toggle('on', !!a.suit); b.textContent = '太空服：' + (a.suit ? '开' : '关'); }
}
function select(i) { selected = i; if (world.agents[i].manual === false && takeOn) setTake(false); syncSuitBtn(); }

/* ---------- 输入 ---------- */
const keys = {}; let takeOn = false;
function setTake(on) {
  takeOn = on; const a = world.agents[selected];
  world.agents.forEach(o => { if (o.manual) { o.manual = false; if (o.goal.type !== 'chat') { o.goal = { type: 'idle', t: 0.5 }; } } });
  if (on && !lineup) { a.manual = true; if (a.goal.type !== 'chat') a.goal = { type: 'manual' }; }
  document.getElementById('bTake').classList.toggle('on', on);
  document.getElementById('bTake').textContent = on ? '放开，交还给 AI' : '接管所选角色';
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (e.repeat && (k === ' ' || k === 'w' || k === 'arrowup')) { e.preventDefault(); return; }
  if (k >= '1' && k <= '6') { if (takeOn) setTake(false); select(+k - 1); return; }
  if (k === 'u') { world.toggleSuit(world.agents[selected]); syncSuitBtn(); return; }
  if (k === 't') { setTake(!takeOn); return; }
  const move = ['a', 'd', 'arrowleft', 'arrowright', ' ', 'w', 'arrowup', 's', 'arrowdown', 'shift', 'y', 'j', 'k'].includes(k);
  if (!move) return; e.preventDefault();
  if (!takeOn && !lineup) setTake(true);
  keys[k] = true;
  if (k === ' ' || k === 'w' || k === 'arrowup') world.input.jumpEdge = true;
  if (k === 'y') world.input.interactEdge = true;
  if (k === 'j' || k === 'k') world.input.blinkEdge = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / SC + camX; let bi = -1, bd = 22;
  world.agents.forEach((a, i) => { const d = Math.abs(a.x - mx); if (d < bd) { bd = d; bi = i; } });
  if (bi >= 0) { if (takeOn) setTake(false); select(bi); }
});
document.getElementById('bPause').onclick = e => { paused = !paused; e.target.textContent = paused ? '继续' : '暂停'; e.target.classList.toggle('on', paused); };
document.getElementById('bFast').onclick = e => { speed = speed === 1 ? 3 : 1; e.target.classList.toggle('on', speed > 1); };
document.getElementById('bSuit').onclick = () => { world.toggleSuit(world.agents[selected]); syncSuitBtn(); };
document.getElementById('bBlink').onclick = () => { if (!takeOn && !lineup) setTake(true); world.input.blinkEdge = true; };
document.getElementById('bLine').onclick = e => { lineup = !lineup; if (lineup) setTake(false); world.setLineup(lineup); e.target.classList.toggle('on', lineup); e.target.textContent = lineup ? '放开，恢复自由行动' : '集合对比待机'; };

/* ---------- 主循环 ---------- */
let last = performance.now(), acc = 0, T = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    acc += dt * speed; const h = 1 / 60;
    while (acc >= h) {
      const inp = world.input; inp.dir = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0); inp.run = !!keys['shift']; inp.crouch = !!(keys['s'] || keys['arrowdown']);
      world.step(h); stepFX(h); acc -= h; T += h;
    }
  }
  const sel = world.agents[selected], target = lineup ? 240 : sel.x;
  camX += (Math.max(0, Math.min(WW - VW, target - VW / 2)) - camX) * Math.min(1, dt * 5);
  drawBackground(camX, T);
  drawGround(camX, AI_H);
  world.pois.forEach(p => drawPOI(p, camX, T));
  drawFXBack(camX);
  const order = world.agents.map((a, i) => i).sort((p, q) => (p === selected) - (q === selected));
  const tops = []; order.forEach(i => { tops[i] = drawChar(world.agents[i], camX, T); });
  drawFXFront(camX);
  drawFog(camX, T);
  drawMarker(tops[selected].sx, tops[selected].top - 8, T);
  ctx.putImageData(img, 0, 0);
  placeOverlay(tops); drawCards(T);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__world = world;
</script>
